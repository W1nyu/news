<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="네이버 경제 8개 섹션의 일일 뉴스 요약">
  <title>아침 경제 · 뉴스</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231b5344'/%3E%3Cpath d='M10 28V17h5v11zm8 0V10h5v18zm8 0V20h5v8z' fill='%23dbea9b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="minimal.css?v=__ASSET_VERSION__">
  <script src="app.js?v=__ASSET_VERSION__" defer></script>
</head>
<body>
<div class="shell">
  <header><a class="brand" href="/">아침 경제<span>NEWS BRIEF</span></a><div class="actions"><button id="settings" class="text-button" type="button">키워드 설정</button><button id="collect" type="button" data-collect="">지금 수집</button></div></header>
  <main>
    <div class="title-row"><div><p class="eyebrow">NAVER ECONOMY</p><h1>경제 뉴스</h1></div><span id="updated"></span></div>
    <div id="missing-today" hidden><span id="missing-today-text"></span><button type="button" data-collect="">지금 수집</button></div>
    <div class="toolbar"><label><span class="sr-only">보고서 날짜</span><select id="date"><option value="">최신 보고서</option></select></label><label class="search"><span class="sr-only">전체 날짜 검색</span><input id="search" type="search" placeholder="전체 날짜에서 뉴스 검색" autocomplete="off"></label><label><span class="sr-only">기간</span><select id="range" disabled><option value="all">전체 기간</option><option value="7">최근 7일</option><option value="30">최근 30일</option><option value="custom">직접 입력</option></select></label><label><span class="sr-only">언론사</span><select id="publisher"><option value="">전체 언론사</option></select></label></div>
    <div id="range-custom" class="range-custom" hidden><label>시작일 <input id="from" type="date"></label><span>~</span><label>종료일 <input id="to" type="date"></label></div>
    <nav id="headlines" aria-label="오늘의 헤드라인" hidden></nav>
    <nav id="categories" aria-label="경제 섹션"></nav>
    <div id="status" role="status" hidden><span id="status-text"></span><div id="progress" hidden><div id="progress-bar"></div></div></div>
    <div id="articles" class="cards" aria-live="polite"></div>
    <button id="more" hidden type="button">더 보기</button>
  </main>
  <footer>네이버 경제 · 무료 기사 · 원문 문장 발췌(제목 연관)</footer>
</div>
<dialog id="keyword-dialog" aria-labelledby="keyword-heading">
  <form id="keyword-form">
    <div class="dialog-heading"><h2 id="keyword-heading">키워드 설정</h2><button id="keyword-close" type="button" aria-label="설정 닫기">닫기</button></div>
    <p class="settings-help">기사 제목에 포함된 키워드의 점수를 합산합니다. +는 우선, -는 후순위로 수집하며 0은 영향을 주지 않습니다. 저장한 설정은 다음 수집부터 적용됩니다.</p>
    <div class="keyword-table"><div class="keyword-labels"><span>키워드</span><span>가중치 (-100~100)</span><span></span></div><div id="keyword-rows"></div></div>
    <button id="keyword-add" type="button">+ 키워드 추가</button>
    <p id="keyword-status" role="status"></p>
    <div class="dialog-footer"><span>최대 100개 · 영문 대소문자 구분 없음</span><button id="keyword-save" type="submit">설정 저장</button></div>
  </form>
</dialog>
</body></html>
